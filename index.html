<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест: Верно / Неверно (1-50)</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c1e21; --muted:#6b7280;
  --accent:#3b5bdb; --accent-light:#e8ecff; --border:#e3e5e9;
  --correct:#1a9e5c; --correct-bg:#e6f7ee; --wrong:#e0344c; --wrong-bg:#fdeaec;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15161a; --card:#1e2025; --text:#eceef1; --muted:#9aa0aa;
    --accent:#7b93ff; --accent-light:#262b45; --border:#33363d;
    --correct:#3ddc8a; --correct-bg:#123425; --wrong:#ff6b81; --wrong-bg:#3a1620;
  }
}
:root[data-theme="dark"]{
  --bg:#15161a; --card:#1e2025; --text:#eceef1; --muted:#9aa0aa;
  --accent:#7b93ff; --accent-light:#262b45; --border:#33363d;
  --correct:#3ddc8a; --correct-bg:#123425; --wrong:#ff6b81; --wrong-bg:#3a1620;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100%;
}
.wrap{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
header{ text-align:center; padding:18px 0 8px;}
header h1{font-size:1.35rem; margin:0 0 4px;}
header p{color:var(--muted); margin:0; font-size:.92rem;}

.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:0 1px 3px rgba(0,0,0,.06);}

.progress-wrap{margin:16px 0 22px;}
.progress-bar{height:8px; background:var(--border); border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease;}
.progress-text{display:flex; justify-content:space-between; font-size:.82rem; color:var(--muted); margin-top:6px;}

#start-screen{text-align:center;}
#start-screen p{color:var(--muted); line-height:1.5;}
.big-btn{
  display:inline-block; background:var(--accent); color:#fff; border:none;
  padding:14px 34px; border-radius:12px; font-size:1rem; font-weight:600;
  cursor:pointer; margin-top:14px; transition:transform .1s ease, opacity .15s;
}
.big-btn:active{transform:scale(0.97);}
.big-btn:hover{opacity:.92;}
.secondary-btn{
  background:transparent; color:var(--accent); border:1px solid var(--accent);
  padding:10px 22px; border-radius:10px; font-size:.92rem; font-weight:600; cursor:pointer;
}

.q-number{color:var(--accent); font-weight:700; font-size:.85rem; letter-spacing:.02em; margin-bottom:8px;}
.q-stem{white-space:pre-line; line-height:1.55; font-size:1rem; margin-bottom:18px;}
.options{display:flex; flex-direction:column; gap:10px;}
.option{
  display:flex; align-items:flex-start; gap:12px; padding:13px 14px; border:1.5px solid var(--border);
  border-radius:12px; cursor:pointer; transition:border-color .15s, background .15s; line-height:1.4; font-size:.94rem;
}
.option:hover{border-color:var(--accent);}
.option.selected{border-color:var(--accent); background:var(--accent-light);}
.option.correct{border-color:var(--correct); background:var(--correct-bg);}
.option.wrong{border-color:var(--wrong); background:var(--wrong-bg);}
.option .letter{
  flex:0 0 auto; width:26px; height:26px; border-radius:50%; background:var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.82rem; color:var(--text);
}
.option.selected .letter{background:var(--accent); color:#fff;}
.option.correct .letter{background:var(--correct); color:#fff;}
.option.wrong .letter{background:var(--wrong); color:#fff;}

.nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px;}
.nav-btn{
  background:var(--accent); color:#fff; border:none; padding:12px 24px; border-radius:10px;
  font-size:.94rem; font-weight:600; cursor:pointer;
}
.nav-btn:disabled{opacity:.4; cursor:not-allowed;}
.nav-btn.ghost{background:transparent; color:var(--muted); border:1.5px solid var(--border);}

#quiz-screen, #result-screen{display:none;}

.result-hero{text-align:center; padding:10px 0 6px;}
.score-ring{
  width:150px; height:150px; margin:10px auto 18px; position:relative;
}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .bg{fill:none; stroke:var(--border); stroke-width:10;}
.score-ring .fg{fill:none; stroke:var(--accent); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 1s ease;}
.score-ring .center{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.score-ring .center .pct{font-size:1.9rem; font-weight:800;}
.score-ring .center .frac{font-size:.85rem; color:var(--muted);}
.result-msg{font-size:1.05rem; font-weight:600; margin-bottom:4px;}
.result-sub{color:var(--muted); font-size:.9rem; margin-bottom:22px;}

.review-item{border-bottom:1px solid var(--border); padding:14px 0;}
.review-item:last-child{border-bottom:none;}
.review-q{font-size:.85rem; color:var(--muted); margin-bottom:4px; white-space:pre-line;}
.review-answer{font-size:.92rem; padding:8px 12px; border-radius:8px; margin-top:4px;}
.review-answer.correct{background:var(--correct-bg); color:var(--correct); font-weight:600;}
.review-answer.wrong{background:var(--wrong-bg); color:var(--wrong); font-weight:600;}
.review-answer .also{display:block; font-weight:400; color:var(--text); margin-top:3px; opacity:.85;}
.review-toggle{
  width:100%; text-align:left; background:transparent; border:none; color:var(--accent);
  font-weight:600; font-size:.92rem; cursor:pointer; padding:10px 0;
}
#review-list{display:none; margin-top:6px;}

.footer-actions{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Верно / Неверно</h1>
    <p>Тест по конституционному и правовому материалу &middot; 50 вопросов</p>
  </header>

  <div class="card" id="start-screen">
    <p>Тест состоит из 50 вопросов с четырьмя вариантами ответа. В конце вы увидите свой результат и разбор ответов.</p>
    <button class="big-btn" onclick="startQuiz()">Начать тест</button>
  </div>

  <div class="card" id="quiz-screen">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text"><span id="progress-label">Вопрос 1 из 50</span><span id="progress-score"></span></div>
    </div>
    <div class="q-number" id="q-number">ВОПРОС 1</div>
    <div class="q-stem" id="q-stem"></div>
    <div class="options" id="options"></div>
    <div class="nav-row">
      <button class="nav-btn ghost" id="prev-btn" onclick="prevQ()">Назад</button>
      <button class="nav-btn" id="next-btn" onclick="nextQ()" disabled>Далее</button>
    </div>
  </div>

  <div class="card" id="result-screen">
    <div class="result-hero">
      <div class="score-ring">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="bg" cx="75" cy="75" r="65"></circle>
          <circle class="fg" id="score-circle" cx="75" cy="75" r="65"></circle>
        </svg>
        <div class="center">
          <div class="pct" id="score-pct">0%</div>
          <div class="frac" id="score-frac">0 / 50</div>
        </div>
      </div>
      <div class="result-msg" id="result-msg"></div>
      <div class="result-sub" id="result-sub"></div>
    </div>
    <button class="review-toggle" onclick="toggleReview()">Показать разбор ответов &darr;</button>
    <div id="review-list"></div>
    <div class="footer-actions">
      <button class="secondary-btn" onclick="restartQuiz()">Пройти заново</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS = [{"stem": "В каком ответе даны правильные определения следующих понятий?\n\nI. Ратификация — официальное утверждение международного договора высшим органом государственной власти в установленном порядке.\nII. Суверенитет — полная независимость государства во внутренних и внешних делах.\nIII. Федерация — форма государственного устройства, при которой государство состоит из территориальных образований, обладающих определённой политической самостоятельностью.\nIV. Денонсация — официальное подтверждение гражданства иностранного государства.", "options": ["I — верно; II — верно; III — верно; IV — неверно", "I — неверно; II — верно; III — неверно; IV — верно", "I — верно; II — неверно; III — верно; IV — неверно", "I — неверно; II — неверно; III — верно; IV — верно"], "correct": 0}, {"stem": "В каком ответе правильно определены стадии совершения умышленного преступления?\n\nI. Приготовление к преступлению предшествует покушению на преступление.\nII. Покушение на преступление предшествует оконченному преступлению.\nIII. Обнаружение умысла всегда является обязательной стадией совершения преступления.\nIV. Оконченное преступление является более ранней стадией по отношению к приготовлению.", "options": ["I — неверно; II — неверно; III — верно; IV — верно", "I — верно; II — верно; III — неверно; IV — неверно", "I — верно; II — неверно; III — неверно; IV — верно", "I — неверно; II — верно; III — верно; IV — неверно"], "correct": 1}, {"stem": "Какие утверждения соответствуют положениям о принятии и вступлении закона в силу?\n\nI. Законодательная палата направляет принятый закон в Сенат не позднее десяти дней со дня его принятия.\nII. Сенат рассматривает закон в течение шестидесяти дней.\nIII. Одобренный Сенатом закон направляется Президенту не позднее десяти дней.\nIV. Президент обязан подписать и обнародовать закон в течение четырнадцати дней во всех случаях.", "options": ["I — верно; II — неверно; III — верно; IV — неверно", "I — неверно; II — верно; III — неверно; IV — верно", "I — верно; II — верно; III — неверно; IV — неверно", "I — верно; II — верно; III — верно; IV — неверно"], "correct": 0}, {"stem": "Какие утверждения о Президенте Республики Узбекистан являются верными?\n\nI. Президент издаёт указы, постановления и распоряжения.\nII. Акты Президента обязательны на всей территории Республики Узбекистан.\nIII. Президент вправе передавать исполнение своих полномочий государственным органам или должностным лицам.\nIV. Президент осуществляет только те полномочия, которые прямо перечислены в одной статье Конституции.", "options": ["I — неверно; II — верно; III — верно; IV — неверно", "I — верно; II — неверно; III — неверно; IV — верно", "I — неверно; II — неверно; III — верно; IV — верно", "I — верно; II — верно; III — неверно; IV — неверно"], "correct": 3}, {"stem": "Какие утверждения о роспуске палат Олий Мажлиса соответствуют Конституции?\n\nI. Законодательная палата и Сенат могут быть распущены решением Президента.\nII. Для роспуска палат требуется согласование с Конституционным судом.\nIII. После роспуска новые выборы должны проводиться в течение трёх месяцев.\nIV. Палаты могут быть распущены в период действия чрезвычайного положения.", "options": ["I — верно; II — неверно; III — верно; IV — верно", "I — верно; II — верно; III — верно; IV — неверно", "I — неверно; II — верно; III — неверно; IV — верно", "I — верно; II — неверно; III — неверно; IV — неверно"], "correct": 1}, {"stem": "Какие утверждения о временном исполнении обязанностей Президента являются верными?\n\nI. При невозможности исполнения Президентом своих обязанностей они временно возлагаются на Председателя Сената.\nII. Выборы Президента в таком случае проводятся в течение трёх месяцев.\nIII. Временное исполнение обязанностей Президента автоматически возлагается на Премьер-министра.\nIV. После истечения полномочий Президент, ушедший в отставку, занимает пожизненно должность члена Сената.", "options": ["I — верно; II — верно; III — неверно; IV — верно", "I — верно; II — неверно; III — верно; IV — неверно", "I — неверно; II — верно; III — верно; IV — неверно", "I — верно; II — верно; III — верно; IV — неверно"], "correct": 0}, {"stem": "Какие утверждения относятся к полномочиям Президента?\n\nI. Президент решает вопросы гражданства Республики Узбекистан.\nII. Президент предоставляет политическое убежище.\nIII. Президент вносит в Сенат представления о принятии актов об амнистии.\nIV. Президент не вправе осуществлять помилование лиц, осуждённых судами Республики Узбекистан.", "options": ["I — верно; II — неверно; III — неверно; IV — верно", "I — верно; II — верно; III — верно; IV — неверно", "I — неверно; II — верно; III — верно; IV — неверно", "I — верно; II — верно; III — неверно; IV — неверно"], "correct": 1}, {"stem": "Какие утверждения о Кабинете Министров соответствуют Конституции?\n\nI. Члены Кабинета Министров назначаются Президентом после одобрения их кандидатур Законодательной палатой.\nII. Президент вправе отправить в отставку Премьер-министра.\nIII. Законодательная палата вправе заслушивать отчёт члена Кабинета Министров по вопросам его деятельности.\nIV. Члены Кабинета Министров освобождены от обязанности отвечать на парламентские запросы.", "options": ["I — верно; II — верно; III — верно; IV — неверно", "I — неверно; II — верно; III — неверно; IV — верно", "I — верно; II — неверно; III — верно; IV — неверно", "I — неверно; II — неверно; III — верно; IV — верно"], "correct": 2}, {"stem": "Какие утверждения о законодательной инициативе являются верными?\n\nI. Правом законодательной инициативы обладает Президент.\nII. Таким правом обладает Кабинет Министров.\nIII. Конституционный суд обладает правом законодательной инициативы по вопросам своего ведения.\nIV. Сенат непосредственно осуществляет право законодательной инициативы путём внесения законопроекта в Законодательную палату.", "options": ["I — неверно; II — верно; III — неверно; IV — верно", "I — верно; II — верно; III — верно; IV — неверно", "I — верн const LETTERS = ['A','B','C','D'];
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

function startQuiz(){
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[current];
  document.getElementById('q-number').textContent = 'ВОПРОС ' + (current+1);
  document.getElementById('q-stem').textContent = q.stem;
  document.getElementById('progress-label').textContent = 'Вопрос ' + (current+1) + ' из ' + QUESTIONS.length;
  const answeredCount = answers.filter(a => a !== null).length;
  document.getElementById('progress-score').textContent = 'Отвечено: ' + answeredCount;
  document.getElementById('progress-fill').style.width = (((current)/(QUESTIONS.length-1))*100) + '%';

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = '';
  q.options.forEach((optText, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = '<span class="letter">' + LETTERS[idx] + '</span><span>' + optText.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</span>';
    if(answers[current] !== null){
      if(idx === q.correct) div.classList.add('correct');
      else if(idx === answers[current]) div.classList.add('wrong');
      if(idx === answers[current]) div.classList.add('selected');
    }
    div.onclick = () => selectOption(idx);
    optWrap.appendChild(div);
  });

  document.getElementById('prev-btn').disabled = current === 0;
  const nextBtn = document.getElementById('next-btn');
  nextBtn.disabled = answers[current] === null;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Завершить тест' : 'Далее';
}

function selectOption(idx){
  if(answers[current] !== null) return;
  answers[current] = idx;
  renderQuestion();
}

function nextQ(){
  if(answers[current] === null) return;
  if(current === QUESTIONS.length - 1){
    showResults();
  } else {
    current++;
    renderQuestion();
  }
}

function prevQ(){
  if(current === 0) return;
  current--;
  renderQuestion();
}

function showResults(){
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  let correctCount = 0;
  QUESTIONS.forEach((q, i) => { if(answers[i] === q.correct) correctCount++; });
  const pct = Math.round((correctCount / QUESTIONS.length) * 100);

  document.getElementById('score-pct').textContent = pct + '%';
  document.getElementById('score-frac').textContent = correctCount + ' / ' + QUESTIONS.length;

  const circle = document.getElementById('score-circle');
  const circumference = 2 * Math.PI * 65;
  circle.style.strokeDasharray = circumference;
  circle.style.strokeDashoffset = circumference;
  setTimeout(() => {
    circle.style.strokeDashoffset = circumference - (pct/100) * circumference;
  }, 80);
  if(pct >= 85){ circle.style.stroke = 'var(--correct)'; }
  else if(pct < 50){ circle.style.stroke = 'var(--wrong)'; }

  let msg, sub;
  if(pct >= 90){ msg = 'Отличный результат!'; sub = 'Материал усвоен на высоком уровне.'; }
  else if(pct >= 70){ msg = 'Хороший результат'; sub = 'Есть небольшие пробелы — стоит повторить разбор ниже.'; }
  else if(pct >= 50){ msg = 'Средний результат'; sub = 'Рекомендуется повторить материал и пройти тест ещё раз.'; }
  else { msg = 'Стоит подготовиться получше'; sub = 'Посмотрите разбор ответов ниже и повторите тему.'; }
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = sub;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const isCorrect = answers[i] === q.correct;
    const item = document.createElement('div');
    item.className = 'review-item';
    const userAnswerText = answers[i] !== null ? LETTERS[answers[i]] + ') ' + q.options[answers[i]] : 'нет ответа';
    const correctAnswerText = LETTERS[q.correct] + ') ' + q.options[q.correct];
    let html = '<div class="review-q">' + (i+1) + '. ' + escapeHtml(q.stem.split('\n')[0]) + '</div>';
    html += '<div class="review-answer ' + (isCorrect ? 'correct' : 'wrong') + '">Ваш ответ: ' + escapeHtml(userAnswerText) + '</div>';
    if(!isCorrect){
      html += '<div class="review-answer correct"><span class="also">Правильный ответ: ' + escapeHtml(correctAnswerText) + '</span></div>';
    }
    item.innerHTML = html;
    reviewList.appendChild(item);
  });
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toggleReview(){
  const list = document.getElementById('review-list');
  const btn = event.target;
  if(list.style.display === 'block'){
    list.style.display = 'none';
    btn.textContent = 'Показать разбор ответов ↓';
  } else {
    list.style.display = 'block';
    btn.textContent = 'Скрыть разбор ответов ↑';
  }
}

function restartQuiz(){
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'block';
  document.getElementById('review-list').style.display = 'none';
}
</script>
